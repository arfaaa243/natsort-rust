[package]
name = "natsort-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust port of Python's natsort (natural human sort ordering)."

[lib]
name = "natsort_core"
path = "src/lib.rs"

[[bin]]
name = "natsort_port"
path = "src/main.rs"

[[bench]]
name = "sort_benchmark"
harness = false

[dev-dependencies]
criterion = "0.5"

# The library and binary have zero runtime dependencies: keeps the crate
# buildable offline and keeps the core algorithm auditable. `criterion` is a
# dev-only dependency (benchmarks aren't compiled into the shipped crate).
# `clap` (CLI parsing) and `proptest` (property tests) are natural additions
# once network/build access is available.
